<loading-bar></loading-bar>

<div class="flex h-screen overflow-hidden" style="background: var(--color-background);">

    @if (sidebarMovilAbierto()) {
    <div class="fixed inset-0 bg-black/30 z-20 lg:hidden" (click)="cerrarMovil()"></div>
    }

    <sidebar [sidebarExpandido]="sidebarExpandido()" [sidebarMovilAbierto]="sidebarMovilAbierto()" [menu]="menu()"
        (cerrarMovil)="cerrarMovil()" (logout)="logout()" (expandir)="toggleExpandido()">
    </sidebar>

    <div class="flex-1 flex flex-col min-w-0 transition-all duration-200" [style.margin-left]="getMarginLeft()">

        <header>
            <div leftSide class="flex items-center gap-2">
                <button
                    class="hidden lg:flex items-center justify-center w-8 h-8 rounded-md transition-colors hover:bg-[var(--color-surface-alt)]"
                    (click)="toggleExpandido()" [title]="sidebarExpandido() ? 'Contraer' : 'Expandir'">
                    <ng-icon [name]="sidebarExpandido() ? 'matChevronLeftOutline' : 'matChevronRightOutline'"
                        style="font-size: 16px; color: var(--sidebar-text);"></ng-icon>
                </button>

                <button
                    class="flex lg:hidden items-center justify-center w-8 h-8 rounded-md transition-colors hover:bg-[var(--color-surface-alt)]"
                    (click)="toggleMovil()">
                    <ng-icon name="matMenuOutline" style="font-size: 16px; color: var(--sidebar-text);"></ng-icon>
                </button>
            </div>

            <div rightSide class="flex items-center gap-4 text-xs text-gray-500 dark:text-zinc-400">
                <button type="button" (click)="theme.toggle()"
                    class="flex items-center justify-center w-8 h-8 rounded-md transition-colors hover:bg-[var(--color-surface-alt)]"
                    [title]="theme.oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
                    <ng-icon [name]="theme.oscuro() ? 'heroSun' : 'heroMoon'"
                        style="font-size: 15px; color: var(--sidebar-text);"></ng-icon>
                </button>

                <span class="flex items-center gap-1.5" [title]="serverTime.now() | date: 'dd/MM/yyyy HH:mm:ss'">
                    <ng-icon name="matAccessTimeOutline" size="14"></ng-icon>
                    {{ serverTime.now() | date: 'HH:mm' }}
                </span>
                <span class="flex items-center gap-1.5">
                    <ng-icon name="matBadgeOutline" size="14"></ng-icon>
                    {{ rolLabel(auth.currentUser()?.rol) }}
                </span>
            </div>
        </header>

        <main class="flex-1 overflow-y-scroll p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>

<app-version-badge></app-version-badge>
