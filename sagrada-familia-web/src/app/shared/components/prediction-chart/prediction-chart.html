<div class="card p-5">
    <h3 class="text-sm font-bold text-slate-700 dark:text-zinc-300 mb-4">{{ title() }}</h3>

    @if (chartOptions()) {
    <apx-chart #chartRef
        [series]="chartOptions()!.series!"
        [chart]="chartOptions()!.chart!"
        [xaxis]="chartOptions()!.xaxis!"
        [yaxis]="chartOptions()!.yaxis!"
        [stroke]="chartOptions()!.stroke!"
        [fill]="chartOptions()!.fill!"
        [markers]="chartOptions()!.markers!"
        [colors]="chartOptions()!.colors!"
        [dataLabels]="chartOptions()!.dataLabels!"
        [tooltip]="chartOptions()!.tooltip!"
        [legend]="chartOptions()!.legend!">
    </apx-chart>
    } @else {
    <div class="w-full h-72 bg-slate-50 dark:bg-zinc-800 flex items-center justify-center border border-dashed border-slate-200 dark:border-zinc-700 rounded-md">
        <span class="text-muted text-sm">Sin datos de predicción disponibles</span>
    </div>
    }
</div>
