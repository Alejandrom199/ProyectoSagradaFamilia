<div class="sticky top-0 z-10 flex items-center justify-between px-5 transition-all duration-200"
    style="height: var(--header-height); background: var(--color-surface); border-bottom: 1px solid var(--color-surface-border);">

    <div class="flex items-center gap-2">
        <ng-content select="[leftSide]"></ng-content>
        <span class="text-sm font-medium ml-2" style="color: var(--color-text-secondary);">
            {{ title() }}
        </span>
    </div>

    <div class="flex items-center gap-4">
        <ng-content select="[rightSide]"></ng-content>
    </div>
</div>
