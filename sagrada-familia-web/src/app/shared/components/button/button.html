<button [type]="type()" [disabled]="disabled()" (click)="onClick()" [style.width]="width()"
  class="press inline-flex items-center justify-center px-4 py-2 font-medium rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-500"
  [ngClass]="{
    'ripple-primary bg-blue-600 text-white hover:bg-blue-700 transition-colors': variant() === 'primary',
    'bg-slate-200 dark:bg-zinc-700 text-slate-800 dark:text-zinc-100 hover:bg-slate-300 transition-colors dark:bg-zinc-700 dark:text-zinc-100 dark:hover:bg-zinc-600': variant() === 'secondary',
    'bg-red-600 text-white hover:bg-red-700 transition-colors': variant() === 'danger',
    'border border-slate-300 dark:border-zinc-600 text-slate-700 dark:text-zinc-300 bg-white dark:bg-zinc-900 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors dark:border-zinc-700 dark:text-zinc-300 dark:bg-zinc-900 dark:hover:bg-zinc-800': variant() === 'outline',
    'bg-transparent text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100 transition-colors dark:text-zinc-400 dark:hover:text-zinc-100': variant() === 'ghost',
    'opacity-50 cursor-not-allowed': disabled()
  }">
  <ng-content></ng-content>
</button>
