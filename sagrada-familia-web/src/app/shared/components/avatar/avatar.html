<div class="flex items-center" [class.gap-3]="sidebarExpandido()">
    <div class="w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold border border-none shrink-0"
        [ngClass]="colorClase()">
        {{ iniciales() }}
    </div>

    @if (sidebarExpandido()) {
    <div class="flex-1 min-w-0">
        <p class="text-gray-800 text-sm truncate">{{ nombre() }} {{ apellido() }}</p>

        @if (textoSexo()) {
        <p class="text-xs text-gray-500 truncate">{{ textoSexo() }}</p>
        }

        @if (textoRol()) {
        <p class="text-xs text-gray-500 truncate">{{ textoRol() }}</p>
        }
    </div>
    }
</div>
