<span class="inline-block px-2.5 py-1 rounded-md text-xs font-semibold tracking-wide"
  [class.pop]="popping()"
  [ngClass]="{
    'bg-success-soft text-success': status() === 'success',
    'bg-warning-soft text-warning': status() === 'warning',
    'bg-danger-soft text-danger': status() === 'danger',
    'bg-info-soft text-info': status() === 'info'
  }">
  {{ text() }}
</span>
