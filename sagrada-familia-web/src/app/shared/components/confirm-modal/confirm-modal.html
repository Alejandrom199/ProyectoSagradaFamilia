<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 transform transition-all">
        <h3 class="text-lg font-bold text-gray-900 mb-2">{{ title() }}</h3>
        <p class="text-gray-600 mb-6">{{ message() }}</p>

        <div class="flex justify-end space-x-3">
            <btn variant="secondary" (clicked)="cancel.emit()">Cancelar</btn>
            <btn variant="danger" (clicked)="confirm.emit()">Confirmar</btn>
        </div>
    </div>
</div>
