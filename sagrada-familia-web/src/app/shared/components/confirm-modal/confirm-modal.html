<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-[2px]">
    <div class="bg-white rounded-md border border-slate-200 w-full max-w-md p-6 animate-fade-in">
        <h3 class="text-lg font-bold text-slate-900 mb-2">
            {{ title() }}
        </h3>

        <p class="text-slate-600 mb-6">
            {{ message() }}
        </p>

        <div class="flex justify-end gap-3">
            <btn variant="secondary" (clicked)="cancel.emit()">
                Cancelar
            </btn>

            <btn variant="danger" (clicked)="confirm.emit()">
                Confirmar
            </btn>
        </div>
    </div>

</div>
