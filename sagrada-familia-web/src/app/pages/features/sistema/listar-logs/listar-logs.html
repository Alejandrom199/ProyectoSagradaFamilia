<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Eventos del sistema</h2>
            <p class="page-subtitle">Eventos, advertencias y errores registrados por el sistema</p>
        </div>

    </div>

    <div class="flex gap-2 mb-4">
        @for (nivel of niveles; track nivel) {
        <button (click)="cambiarNivel(nivel)" [class]="claseTab(nivel)">
            {{ nivel }}
        </button>
        }
    </div>

    <div class="border border-slate-200 overflow-hidden">
        <datatable title="Eventos del sistema" [data]="logs()" [columns]="columnas"
            [serverSide]="true" [serverTotalItems]="totalLogs()" (onServerQuery)="onServerQuery($event)"
            [exportExcel]="true" exportFileName="logs-sistema" [showActualizar]="true" [showExportar]="true" [showColumnas]="true"
            searchPlaceholder="Buscar por mensaje o endpoint..."
            emptyMessage="No hay eventos registrados para este nivel." (onActualizar)="cargarLogs()">
        </datatable>
    </div>
</div>
