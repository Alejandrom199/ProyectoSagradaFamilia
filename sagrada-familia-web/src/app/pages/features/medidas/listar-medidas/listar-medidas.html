<div class="page-container">
    <breadcrumb [items]="migajas()" homeRoute="/dashboard"></breadcrumb>

    <!-- Encabezado -->
    <div class="flex items-start justify-between mb-8">
        <div>
            <h1 class="page-title">Medidas clínicas</h1>
            @if (nino()) {
            <p class="text-sm text-slate-400 mt-0.5">
                {{ nino()?.nombre }} {{ nino()?.apellido }}
            </p>
            }
        </div>
        <btn class="text-white" width="250" variant="primary" (clicked)="abrirModal()">
            <ng-icon name="matAddOutline" size="14" class="mr-1.5 -ml-0.5"></ng-icon>
            Nueva medida
        </btn>
    </div>

    <!-- Tabla -->
    <datatable [title]="'Historial — ' + (nino()?.nombre || '...')" [data]="medidas()" [columns]="columnas"
        [actions]="acciones" [serverSide]="true" [serverTotalItems]="totalMedidas()" (onServerQuery)="onServerQuery($event)"
        searchPlaceholder="Buscar por estado nutricional..."
        emptyMessage="Sin medidas registradas para este paciente." (onActualizar)="cargarMedidas()">
    </datatable>

    <!-- Modal registrar / editar -->
    @if (modalAbierto()) {
    <div class="fixed inset-0 bg-black/25 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md border border-slate-200 overflow-hidden">

            <!-- Cabecera -->
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-7 h-7 rounded-md bg-blue-50 flex items-center justify-center shrink-0">
                        <ng-icon name="matHeightOutline" class="text-blue-500 text-sm"></ng-icon>
                    </div>
                    <span class="text-sm font-bold text-slate-800">
                        {{ editando() ? 'Editar medida' : 'Nueva medida' }}
                    </span>
                </div>
                <button (click)="cerrarModal()"
                    class="w-7 h-7 flex items-center justify-center rounded-md text-slate-400
                           hover:text-slate-600 hover:bg-slate-100 transition-colors">
                    <ng-icon name="matCloseOutline" class="text-base"></ng-icon>
                </button>
            </div>

            <!-- Cuerpo -->
            <div class="px-6 py-5 space-y-5">

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider ml-1">
                        Fecha de medición *
                    </label>
                    <input type="date" [(ngModel)]="form.fechaMedicion" [max]="hoy"
                        class="w-full px-4 py-2.5 rounded-md border border-slate-200 bg-slate-50/30
                               focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500
                               outline-none transition-all text-sm text-slate-700">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider ml-1">
                            Peso (kg) *
                        </label>
                        <input type="number" [(ngModel)]="form.peso" step="0.1" min="0.1" max="30"
                            placeholder="Ej. 10.5"
                            class="w-full px-4 py-2.5 rounded-md border border-slate-200 bg-slate-50/30
                                   focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500
                                   outline-none transition-all text-sm text-slate-700">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider ml-1">
                            Talla (cm) *
                        </label>
                        <input type="number" [(ngModel)]="form.talla" step="0.1" min="0.1" max="130"
                            placeholder="Ej. 78.0"
                            class="w-full px-4 py-2.5 rounded-md border border-slate-200 bg-slate-50/30
                                   focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500
                                   outline-none transition-all text-sm text-slate-700">
                    </div>
                </div>

                @if (errorModal()) {
                <div class="flex items-center gap-2 p-3 bg-red-50 border border-red-100 rounded-md">
                    <span class="w-1.5 h-1.5 bg-red-500 rounded-full shrink-0"></span>
                    <p class="text-xs text-red-600 font-medium">{{ errorModal() }}</p>
                </div>
                }

            </div>

            <!-- Pie -->
            <div class="px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-3">
                <button (click)="cerrarModal()"
                    class="px-4 py-2 text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors">
                    Cancelar
                </button>
                <button (click)="guardar()" [disabled]="guardando()"
                    class="px-6 py-2.5 bg-blue-600 text-white rounded-md text-sm font-bold
                           hover:bg-blue-700 disabled:opacity-50 transition-colors flex items-center gap-2">
                    @if (guardando()) {
                    <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    }
                    {{ editando() ? 'Actualizar medida' : 'Registrar medida' }}
                </button>
            </div>

        </div>
    </div>
    }

    <!-- Modal confirmar eliminación -->
    @if (medidaAEliminar()) {
    <confirm-modal title="Eliminar medida"
        [message]="'Se eliminará la medida del ' + formatearFecha(medidaAEliminar()!.fechaMedicion) + '. Esta acción no se puede deshacer.'"
        (confirm)="confirmarEliminar()" (cancel)="medidaAEliminar.set(null)">
    </confirm-modal>
    }

</div>
