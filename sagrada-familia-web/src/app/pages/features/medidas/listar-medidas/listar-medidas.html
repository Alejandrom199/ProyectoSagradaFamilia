<div class="page-container">
    <breadcrumb [items]="migajas()" homeRoute="/dashboard"></breadcrumb>

    <div class="mb-6 flex justify-between items-end">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Medidas clínicas</h2>
        </div>
        <btn variant="primary" (clicked)="abrirModal()" class="text-white cursor-pointer">
            <ng-icon name="heroPlus" class="mr-2"></ng-icon>
            Registrar medida
        </btn>
    </div>

    <div class="border border-slate-200 overflow-hidden">
        <datatable [title]="'Registro clínico de ' + (nino()?.nombre || '...') + ' ' + (nino()?.apellido || '')"
            [data]="medidas()" [columns]="columnas" [actions]="acciones"
            searchPlaceholder="Buscar por fecha o estado..."
            emptyMessage="No hay medidas registradas para este paciente." (onActualizar)="cargarMedidas()">
        </datatable>
    </div>

    <!-- Modal registrar / editar medida -->
    @if (modalAbierto()) {
    <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-md border border-slate-200 w-full max-w-sm">

            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">
                    {{ editando() ? 'Editar medida' : 'Nueva medida' }}
                </h3>
                <button (click)="cerrarModal()"
                    class="text-slate-400 hover:text-slate-600 transition-colors text-lg leading-none">✕</button>
            </div>

            <div class="px-6 py-5 space-y-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-slate-600 uppercase ml-1">Fecha de medición *</label>
                    <input type="date" [(ngModel)]="form.fechaMedicion" [max]="hoy"
                        class="w-full px-4 py-2.5 rounded-md border border-slate-200 bg-slate-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase ml-1">Peso (kg) *</label>
                        <input type="number" [(ngModel)]="form.peso" step="0.1" min="0" placeholder="Ej. 12.5"
                            class="w-full px-4 py-2.5 rounded-md border border-slate-200 bg-slate-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase ml-1">Talla (cm) *</label>
                        <input type="number" [(ngModel)]="form.talla" step="0.1" min="0" placeholder="Ej. 85.0"
                            class="w-full px-4 py-2.5 rounded-md border border-slate-200 bg-slate-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                    </div>
                </div>

                @if (errorModal()) {
                <div
                    class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-md text-xs font-semibold flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                    {{ errorModal() }}
                </div>
                }
            </div>

            <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
                <button (click)="cerrarModal()"
                    class="px-4 py-2 text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors">
                    Cancelar
                </button>
                <button (click)="guardar()" [disabled]="guardando()"
                    class="px-8 py-2.5 bg-blue-600 text-white rounded-md text-sm font-bold hover:bg-blue-700 disabled:opacity-50 transition-colors flex items-center gap-2">
                    @if (guardando()) {
                    <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    Guardando...
                    } @else {
                    {{ editando() ? 'Actualizar' : 'Registrar' }}
                    }
                </button>
            </div>
        </div>
    </div>
    }

    <!-- Modal confirmar eliminación -->
    @if (medidaAEliminar()) {
    <confirm-modal title="¿Eliminar medida?"
        [message]="'Se eliminará la medida del ' + formatearFecha(medidaAEliminar()!.fechaMedicion) + '.'"
        (confirm)="confirmarEliminar()" (cancel)="medidaAEliminar.set(null)">
    </confirm-modal>
    }
</div>
