<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Gestión de Médicos</h2>
            <p class="page-subtitle">Personal médico pediátrico del consultorio</p>
        </div>
        @if (menu.puedeHacer(RutaApp.Medicos, Accion.Crear)) {
        <btn variant="primary" routerLink="/medicos/crear" class="text-white cursor-pointer">
            <ng-icon name="matAddOutline" class="mr-2"></ng-icon>
            Agregar
        </btn>
        }
    </div>

    <div class="border border-slate-200 overflow-hidden">
        <datatable title="Listado de Médicos" [data]="medicos()" [columns]="columnas" [actions]="acciones()"
            [serverSide]="true" [serverTotalItems]="totalMedicos()" (onServerQuery)="onServerQuery($event)"
            (onExportExcel)="descargarExcel()" exportFileName="medicos"
            searchPlaceholder="Buscar por nombre, email o especialidad..."
            emptyMessage="No hay médicos registrados en el sistema."
            [showPlantilla]="true" (onPlantilla)="descargarPlantilla()"
            [showImportar]="true" (onImportar)="mostrarModalImport.set(true)"
            (onActualizar)="cargarMedicos()">
        </datatable>
    </div>

    @if (medicoAEliminar()) {
    <confirm-modal title="¿Eliminar médico?"
        [message]="'Esta acción eliminará al Dr(a). ' + medicoAEliminar()!.nombre + ' ' + medicoAEliminar()!.apellido + ' del sistema. Las relaciones existentes con pacientes y padres se mantendrán, pero quedarán sin médico asignado.'"
        (confirm)="confirmarEliminar()" (cancel)="medicoAEliminar.set(null)">
    </confirm-modal>
    }

    @if (mostrarModalImport()) {
    <import-modal
        titulo="Importación masiva de médicos"
        subtitulo="Use la plantilla oficial para garantizar el formato correcto."
        [importFn]="importarFn"
        (cerrado)="mostrarModalImport.set(false)"
        (importacionExitosa)="cargarMedicos()">
    </import-modal>
    }
</div>
