<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>
    <div class="mb-6 flex justify-between items-end">
        <div>
            <h2 class="page-title">Gestión de Pacientes</h2>
            <p class="page-subtitle">Gestión clínica de niños registrados en el sistema</p>
        </div>
        @if (menu.puedeHacer(RutaApp.Pacientes, Accion.Crear)) {
        <btn variant="primary" routerLink="/pacientes/crear" class="text-white cursor-pointer">
            <ng-icon name="matAddOutline" class="mr-2"></ng-icon>
            Agregar
        </btn>
        }
    </div>

    <div class="border border-slate-200 overflow-hidden">
        <datatable title="Listado de Pacientes" [data]="ninos()" [columns]="columnas" [actions]="acciones()"
            (onExportPdf)="descargarPacientesPdf($event)" (onExportExcel)="descargarExcel()"
            exportFileName="catalogo-pacientes" searchPlaceholder="Buscar"
            emptyMessage="No hay pacientes registrados en el sistema."
            [serverSide]="true" [serverTotalItems]="totalNinos()" (onServerQuery)="onServerQuery($event)"
            [showPlantilla]="true" (onPlantilla)="descargarPlantilla()"
            [showImportar]="true" (onImportar)="mostrarModalImport.set(true)"
            (onActualizar)="cargarNinos()">
        </datatable>
    </div>

    @if (ninoAEliminar()) {
    <confirm-modal title="¿Eliminar paciente?"
        [message]="'Esta acción eliminará a ' + ninoAEliminar()?.nombre + ' ' + ninoAEliminar()?.apellido + ' del sistema. Su historial médico se conserva; sus citas pendientes se cancelarán.'"
        [errorMessage]="errorEliminar()"
        (confirm)="confirmarEliminar()" (cancel)="ninoAEliminar.set(null); errorEliminar.set(null)">
    </confirm-modal>
    }

    @if (mostrarModalImport()) {
    <import-modal
        titulo="Importación masiva de pacientes"
        subtitulo="Use la plantilla oficial. Seleccione el representante desde el listado desplegable de la columna correspondiente. Los pacientes se asignan al médico que realiza la importación."
        [importFn]="importarFn"
        (cerrado)="mostrarModalImport.set(false)"
        (importacionExitosa)="cargarNinos()">
    </import-modal>
    }
</div>
