<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Gestión de Padres de Familia</h2>
            <p class="page-subtitle">Gestión del directorio de padres y responsables legales</p>
        </div>
        @if (menu.puedeHacer(RutaApp.Padres, Accion.Crear)) {
        <btn variant="primary" routerLink="/padres/crear" class="text-white cursor-pointer">
            <ng-icon name="matAddOutline" class="mr-2"></ng-icon>
            Agregar
        </btn>
        }
    </div>

    <div class="border border-slate-200 overflow-hidden">
        <datatable title="Listado de Padres de Familia" [data]="padres()" [columns]="columnas" [actions]="acciones()"
            [serverSide]="true" [serverTotalItems]="totalPadres()" (onServerQuery)="onServerQuery($event)"
            (onExportPdf)="descargarPadresPdf($event)" (onExportExcel)="descargarExcel()" exportFileName="padres"
            searchPlaceholder="Buscar por nombre..." emptyMessage="No hay padres registrados en el sistema."
            [showPlantilla]="true" (onPlantilla)="descargarPlantilla()"
            [showImportar]="true" (onImportar)="mostrarModalImport.set(true)"
            (onActualizar)="cargarPadres()">
        </datatable>
    </div>

    @if (padreAEliminar()) {
    <confirm-modal title="¿Eliminar representante?"
        [message]="'Esta acción eliminará a ' + padreAEliminar()?.nombre + ' ' + padreAEliminar()?.apellido + ' del sistema y desvinculará a los pacientes asociados a esta cuenta.'"
        (confirm)="confirmarEliminar()" (cancel)="padreAEliminar.set(null)">
    </confirm-modal>
    }

    @if (mostrarModalImport()) {
    <import-modal
        titulo="Importación masiva de representantes"
        subtitulo="Use la plantilla oficial para garantizar el formato correcto."
        [importFn]="importarFn"
        (cerrado)="mostrarModalImport.set(false)"
        (importacionExitosa)="cargarPadres()">
    </import-modal>
    }
</div>
