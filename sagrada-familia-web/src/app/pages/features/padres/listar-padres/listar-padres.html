<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-bold text-gray-800">Gestión de Padres de Familia</h2>
            <p class="text-gray-500 mt-1">Gestión del directorio de padres y responsables legales</p>
        </div>

        <btn variant="primary" routerLink="/padres/crear"
            class="text-white shadow-md hover:shadow-lg transition-shadow cursor-pointer">
            <ng-icon name="heroPlus" class="mr-2"></ng-icon>
            Agregar
        </btn>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <datatable title="Listado de Padres de Familia" [data]="padres()" [columns]="columnas" [actions]="acciones"
            [exportExcel]="true" [exportPdf]="true" (onExportPdf)="descargarPadresPdf($event)" exportFileName="padres"
            [showActualizar]="true" [showExportar]="true" [showColumnas]="true" [showConfiguracion]="true"
            searchPlaceholder="Buscar por nombre..." emptyMessage="No hay padres registrados en el sistema."
            (onActualizar)="cargarPadres()">
        </datatable>
    </div>

    @if (padreAEliminar()) {
    <confirm-modal title="¿Eliminar representante?"
        [message]="'Esta acción eliminará a ' + padreAEliminar()!.nombreCompleto + ' del sistema y desvinculará a los pacientes asociados a esta cuenta.'"
        (confirm)="confirmarEliminar()" (cancel)="padreAEliminar.set(null)">
    </confirm-modal>
    }
</div>
