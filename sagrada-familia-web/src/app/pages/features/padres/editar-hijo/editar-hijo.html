<div class="page-container animate-fade-in">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="max-w-5xl mx-auto">
        <div class="card overflow-hidden flex flex-col lg:flex-row">

            <div class="lg:w-1/3 bg-slate-50 dark:bg-zinc-800/50 border-r border-slate-200 dark:border-zinc-700 p-8">
                <div class="sticky top-8">
                    <div class="w-12 h-12 bg-blue-600 rounded-md flex items-center justify-center mb-6">
                        <ng-icon name="matPersonOutline" color="white"></ng-icon>
                    </div>

                    <h2 class="panel-title">Editar hijo</h2>
                    <p class="text-sm text-secondary mt-3 leading-relaxed">
                        Modificando los datos de
                        <strong>{{ hijo()?.nombre }} {{ hijo()?.apellido }}</strong>.
                    </p>

                    @if (padre()) {
                    <div class="mt-6 p-4 card">
                        <p class="text-xs font-bold text-secondary uppercase tracking-wider mb-1">Representante</p>
                        <p class="text-sm font-semibold text-slate-800 dark:text-zinc-100">
                            {{ padre()?.nombre }} {{ padre()?.apellido }}
                        </p>
                    </div>
                    }

                    <div class="mt-6 space-y-5">
                        <div class="flex gap-4">
                            <div class="mt-1"><ng-icon name="matPersonOutline" class="text-blue-500 text-lg"></ng-icon></div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-700 dark:text-zinc-300 uppercase tracking-wider">Nota</h4>
                                <p class="text-xs text-secondary mt-1">
                                    El representante y el médico tratante no pueden modificarse desde aquí.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:w-2/3 p-8">
                <div class="space-y-6">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-600 dark:text-zinc-400 uppercase ml-1">Nombre *</label>
                            <input type="text" [(ngModel)]="form.nombre" placeholder="Ej. Lucas"
                                class="form-input">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-600 dark:text-zinc-400 uppercase ml-1">Apellido *</label>
                            <input type="text" [(ngModel)]="form.apellido" placeholder="Ej. Pérez"
                                class="form-input">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-600 dark:text-zinc-400 uppercase ml-1">Fecha de nacimiento *</label>
                            <input type="date" [(ngModel)]="form.fechaNacimiento"
                                class="form-input">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-600 dark:text-zinc-400 uppercase ml-1">Sexo *</label>
                            <searchable-select
                                [options]="sexoOptions"
                                valueKey="id"
                                [value]="form.sexo || null"
                                (valueChange)="form.sexo = $event"
                                placeholder="Seleccionar..."
                                searchPlaceholder="Buscar...">
                            </searchable-select>
                        </div>
                    </div>

                    @if (error()) {
                    <div class="p-3 alert-error rounded-md text-xs font-semibold flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                        {{ error() }}
                    </div>
                    }

                    <div class="pt-6 border-t border-slate-200 dark:border-zinc-700 flex items-center justify-end gap-3">
                        <a [routerLink]="rutaCancelar()"
                            class="px-4 py-2 text-sm font-bold text-muted hover:text-slate-600 transition-colors">
                            Cancelar
                        </a>
                        <button (click)="guardar()" [disabled]="guardando()"
                            class="px-8 py-2.5 bg-blue-600 text-white rounded-md text-sm font-bold hover:bg-blue-700 disabled:opacity-50 transition-colors flex items-center gap-2">
                            @if (guardando()) {
                            <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                            Guardando...
                            } @else {
                            <ng-icon name="matPersonOutline" class="text-lg"></ng-icon>
                            Actualizar
                            }
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
