<div class="page-container animate-fade-in">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="max-w-5xl mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col lg:flex-row">

            <!-- Sidebar -->
            <div class="lg:w-1/3 bg-gray-50/50 border-r border-gray-100 p-8">
                <div class="sticky top-8">
                    <div
                        class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200 mb-6">
                        <ng-icon name="heroUser" color="white"></ng-icon>
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800 leading-tight">Editar hijo</h2>
                    <p class="text-sm text-gray-500 mt-3 leading-relaxed">
                        Modificando los datos de
                        <strong>{{ hijo()?.nombre }} {{ hijo()?.apellido }}</strong>.
                    </p>

                    @if (padre()) {
                    <div class="mt-6 p-4 bg-white rounded-xl border border-gray-200">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Representante</p>
                        <p class="text-sm font-semibold text-gray-800">
                            {{ padre()?.nombre }} {{ padre()?.apellido }}
                        </p>
                    </div>
                    }

                    <div class="mt-6 space-y-5">
                        <div class="flex gap-4">
                            <div class="mt-1"><ng-icon name="heroUser" class="text-blue-500 text-lg"></ng-icon></div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wider">Nota</h4>
                                <p class="text-xs text-gray-500 mt-1">
                                    El representante y el médico tratante no pueden modificarse desde aquí.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulario -->
            <div class="lg:w-2/3 p-8">
                <div class="space-y-6">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-gray-600 uppercase ml-1">Nombre *</label>
                            <input type="text" [(ngModel)]="form.nombre" placeholder="Ej. Lucas"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-gray-600 uppercase ml-1">Apellido *</label>
                            <input type="text" [(ngModel)]="form.apellido" placeholder="Ej. Pérez"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-gray-600 uppercase ml-1">Fecha de nacimiento *</label>
                            <input type="date" [(ngModel)]="form.fechaNacimiento"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-gray-600 uppercase ml-1">Sexo *</label>
                            <select [(ngModel)]="form.sexo"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50/30 focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                                <option value="">Seleccionar...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                    </div>

                    @if (error()) {
                    <div
                        class="p-3 bg-red-50 border border-red-100 text-red-600 rounded-xl text-xs font-semibold flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                        {{ error() }}
                    </div>
                    }

                    <div class="pt-6 border-t border-gray-100 flex items-center justify-end gap-3">
                        <a [routerLink]="rutaCancelar()"
                            class="px-4 py-2 text-sm font-bold text-gray-400 hover:text-gray-600 transition-colors">
                            Cancelar
                        </a>
                        <button (click)="guardar()" [disabled]="guardando()"
                            class="px-8 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md shadow-blue-100 hover:bg-blue-700 hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:translate-y-0 transition-all flex items-center gap-2">
                            @if (guardando()) {
                            <span
                                class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                            Guardando...
                            } @else {
                            <ng-icon name="heroUser" class="text-lg"></ng-icon>
                            Actualizar
                            }
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
