<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Gestión de Alimentos</h2>
            <p class="page-subtitle">Catálogo de alimentos recomendados por edad</p>
        </div>
        <div class="flex items-center gap-2">
            @if (menu.puedeHacer(RutaApp.Alimentos, Accion.Crear)) {
            <btn variant="primary" routerLink="/alimentos/crear" class="text-white cursor-pointer">
                <ng-icon name="matAddOutline" class="mr-2"></ng-icon>
                Agregar
            </btn>
            }
        </div>
    </div>

    <div class="border border-slate-200 dark:border-zinc-700 overflow-hidden">
        <datatable title="Listado de alimentos" [data]="alimentos()" [columns]="columnas" [actions]="acciones()"
            [serverSide]="true" [serverTotalItems]="totalAlimentos()" (onServerQuery)="onServerQuery($event)"
            [filterOptions]="filterOptions()"
            exportFileName="catalogo-alimentos" (onExportPdf)="descargarAlimentosPdf($event)"
            (onExportExcel)="descargarExcel()" [showPlantilla]="true" (onPlantilla)="descargarPlantilla()"
            [showImportar]="true" (onImportar)="mostrarModalImport.set(true)" (onActualizar)="cargarDatos()"
            emptyMessage="No hay alimentos registrados en el sistema.">
        </datatable>
    </div>

    @if (alimentoAEliminar()) {
    <confirm-modal title="¿Eliminar alimento?"
        [message]="'Esta acción eliminará a ' + alimentoAEliminar()?.nombre + ' del catálogo general. Esta acción no se puede deshacer.'"
        (confirm)="confirmarEliminar()" (cancel)="alimentoAEliminar.set(null)">
    </confirm-modal>
    }

    @if (mostrarModalImport()) {
    <import-modal titulo="Importación masiva de alimentos"
        subtitulo="Use la plantilla oficial para garantizar el formato correcto." [importFn]="importarFn"
        (cerrado)="mostrarModalImport.set(false)" (importacionExitosa)="cargarDatos()">
    </import-modal>
    }
</div>
