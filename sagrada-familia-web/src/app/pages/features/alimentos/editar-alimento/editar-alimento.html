<div>
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="mb-6">
        <h2 class="text-xl font-bold text-[var(--color-text-primary)]">Editar alimento</h2>
        <p class="text-sm text-[var(--color-text-secondary)] mt-0.5">
            Modificar datos de {{ alimento()?.nombre }}
        </p>
    </div>

    <div class="card max-w-2xl">
        <div class="card-header">Datos del alimento</div>
        <div class="card-body space-y-4">

            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="form-label">Nombre *</label>
                    <input class="form-input" type="text" [(ngModel)]="form.nombre">
                </div>
                <div class="form-group">
                    <label class="form-label">Categoría *</label>
                    <select class="form-input" [(ngModel)]="form.categoriaId">
                        <option [ngValue]="0">Seleccionar categoría...</option>
                        @for (cat of categorias(); track cat.id) {
                        <option [ngValue]="cat.id">{{ cat.nombre }}</option>
                        }
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Descripción</label>
                <textarea class="form-input" rows="2" [(ngModel)]="form.descripcion"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="form-label">Edad mínima introducción (meses) *</label>
                    <input class="form-input" type="number" min="0" max="60" [(ngModel)]="form.edadMinimaIntro">
                </div>
                <div class="form-group">
                    <label class="form-label">Edad máxima (meses)</label>
                    <input class="form-input" type="number" min="0" max="60" [(ngModel)]="form.edadMaxima">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Recomendación</label>
                <textarea class="form-input" rows="2" [(ngModel)]="form.recomendacion"></textarea>
            </div>

            @if (error()) {
            <div class="alert alert-error">{{ error() }}</div>
            }

            <div class="flex gap-3 justify-end pt-2">
                <a routerLink="/alimentos" class="btn btn-secondary btn-md">Cancelar</a>
                <button class="btn btn-primary btn-md" [disabled]="guardando()" (click)="guardar()">
                    @if (guardando()) {
                    <span
                        class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"></span>
                    }
                    Actualizar
                </button>
            </div>
        </div>
    </div>
</div>
