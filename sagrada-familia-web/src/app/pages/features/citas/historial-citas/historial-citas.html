<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Historial de Citas</h2>
            <p class="page-subtitle">Todas las consultas registradas en tu agenda</p>
        </div>
    </div>

    <div class="border border-slate-200 dark:border-zinc-700 overflow-hidden">
        <datatable title="Historial completo" [data]="citas()" [columns]="columnas" [actions]="acciones"
            [exportExcel]="true" exportFileName="historial-citas" searchPlaceholder="Buscar por paciente o motivo..."
            emptyMessage="No hay citas registradas en tu historial." (onActualizar)="cargarHistorial()"
            (onExportPdf)="exportarPdf()" (onExportExcel)="descargarExcel()">
        </datatable>
    </div>
</div>
