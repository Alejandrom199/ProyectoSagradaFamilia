<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="mb-6 flex justify-between items-end">
        <div>
            <h2 class="page-title">Citas del paciente</h2>
        </div>
        <btn variant="primary" [routerLink]="['/citas/crear']" [queryParams]="{ ninoId: ninoId }"
            class="text-white cursor-pointer">
            <ng-icon name="matAddOutline" class="mr-2"></ng-icon>
            Nueva cita
        </btn>
    </div>

    <div class="border border-slate-200 dark:border-zinc-700 overflow-hidden">
        <datatable title="Historial de citas" [data]="citas()" [columns]="columnas" [actions]="acciones"
            [serverSide]="true" [serverTotalItems]="totalCitas()" [filterOptions]="filterOptions()" (onServerQuery)="onServerQuery($event)"
            [exportExcel]="true" exportFileName="citas-paciente" [showActualizar]="true" [showExportar]="true"
            (onExportPdf)="exportarPdf()" (onExportExcel)="descargarExcel()" searchPlaceholder="Buscar por motivo o médico..."
            emptyMessage="Este paciente no tiene citas registradas." (onActualizar)="cargarCitas()">
        </datatable>
    </div>
</div>
