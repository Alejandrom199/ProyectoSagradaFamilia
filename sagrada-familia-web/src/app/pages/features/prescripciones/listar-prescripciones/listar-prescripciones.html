<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Historial de prescripciones</h2>
        </div>
        <btn variant="primary" [routerLink]="['/prescripciones/crear']" [queryParams]="{ ninoId: ninoId }"
            class="text-white cursor-pointer">
            <ng-icon name="matAddOutline" class="mr-2"></ng-icon>
            Nueva receta
        </btn>
    </div>

    <div class="border border-slate-200 overflow-hidden">
        <datatable title="Recetas médicas" [data]="prescripciones()" [columns]="columnas" [exportExcel]="true"
            exportFileName="prescripciones-paciente" [showActualizar]="true" [showExportar]="true"
            searchPlaceholder="Buscar por medicamento o médico..."
            emptyMessage="Este paciente no tiene prescripciones registradas." (onActualizar)="cargarPrescripciones()">
        </datatable>
    </div>
</div>
