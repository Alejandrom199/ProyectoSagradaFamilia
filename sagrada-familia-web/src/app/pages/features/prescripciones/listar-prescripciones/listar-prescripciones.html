<div class="page-container">
    <breadcrumb [items]="migajas" homeRoute="/dashboard"></breadcrumb>

    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="page-title">Historial de prescripciones</h2>
        </div>
    </div>

    <div class="border border-slate-200 dark:border-zinc-700 overflow-hidden">
        <datatable title="Recetas médicas" [data]="prescripciones()" [columns]="columnas"
            [serverSide]="true" [serverTotalItems]="totalPrescripciones()" [filterOptions]="filterOptions()" (onServerQuery)="onServerQuery($event)"
            [exportExcel]="true" exportFileName="prescripciones-paciente" [showActualizar]="true" [showExportar]="true"
            searchPlaceholder="Buscar por medicamento o médico..."
            (onExportPdf)="exportarPdf()" (onExportExcel)="descargarExcel()"
            emptyMessage="Este paciente no tiene prescripciones registradas." (onActualizar)="cargarPrescripciones()">
        </datatable>
    </div>
</div>
