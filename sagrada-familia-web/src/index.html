<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SagradaFamiliaWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="sagrada.ico">
  <script>
    // Aplica el tema ANTES de que Angular arranque, para evitar el flash del
    // tema equivocado. ThemeService lee este mismo estado al iniciar.
    (function () {
      try {
        var guardado = localStorage.getItem('theme');
        var oscuro = guardado === 'dark' || (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
