# =============================================================================
# nginx.conf — Sagrada Familia Web
#
# Responsabilidades:
#   1. Servir el SPA de Angular (archivos estáticos con caché agresivo)
#   2. Proxy inverso de /api/ hacia el contenedor .NET (api:5000)
#   3. SPA routing: delegar rutas desconocidas a index.html
# =============================================================================

# 'auto' usa todos los cores del contenedor disponibles en runtime
worker_processes auto;

error_log /var/log/nginx/error.log warn;
# /tmp/nginx.pid permite arrancar nginx sin privilegios de root
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile          on;
    keepalive_timeout 65;

    # No exponer la versión de nginx en la cabecera Server (seguridad)
    server_tokens off;

    # ── Compresión gzip ───────────────────────────────────────────────────────
    # Reduce el tamaño de transferencia de JS/CSS/JSON en tránsito.
    # Los bundles de Angular comprimen muy bien (relación ~3:1 habitual).
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Upstream del backend .NET ─────────────────────────────────────────────
    # 'api' es el nombre del servicio en docker-compose.
    # Docker resuelve el nombre vía su DNS interno de red.
    upstream api_backend {
        server api:5000;
    }

    server {
        listen      80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Cabeceras de seguridad HTTP ───────────────────────────────────────
        # Se aplican a todas las respuestas de este servidor.
        # 'always' las incluye también en respuestas de error (4xx, 5xx).
        add_header X-Frame-Options          "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-XSS-Protection         "1; mode=block"                   always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        # Permite al navegador detectar recursos desactivados sin romper la app
        add_header Permissions-Policy       "geolocation=(), microphone=()"   always;

        # ── Activos estáticos con caché agresivo ──────────────────────────────
        # Angular añade un hash al nombre de cada archivo en producción
        # (ej. main.3f8a2c1d.js). Cambiar el contenido genera un hash distinto,
        # por lo que es seguro indicar al navegador que los cachée indefinidamente.
        # 'immutable' evita solicitudes de revalidación (If-Modified-Since).
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Proxy inverso hacia la API .NET ───────────────────────────────────
        # Toda petición que empiece por /api/ se reenvía al backend .NET.
        # nginx inyecta las cabeceras X-Forwarded-* para que ASP.NET Core
        # conozca la IP real del cliente y el protocolo original.
        # (ASPNETCORE_FORWARDEDHEADERS_ENABLED=true en el contenedor api
        #  habilita la lectura de estas cabeceras.)
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout generoso para endpoints lentos (predicciones con Prophet)
            proxy_read_timeout    90s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
        }

        # ── Enrutamiento SPA (Angular Router) ─────────────────────────────────
        # Sin este bloque, refrescar la página en /pacientes/123 devuelve 404
        # porque nginx busca un archivo llamado 'pacientes/123' que no existe.
        # try_files intenta el archivo exacto → el directorio → cae en index.html,
        # y Angular Router maneja el resto desde el cliente.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
