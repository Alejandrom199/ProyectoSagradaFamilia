name: Publish Docker Images

# Se dispara al hacer merge de dev → main (Pull Request mergeado).
# Construye y publica las 3 imágenes custom en Docker Hub en paralelo.
# La imagen db (SQL Server) es oficial de Microsoft; no se construye ni publica.
on:
  push:
    branches:
      - main

jobs:

  # ══════════════════════════════════════════════════════════════════════════════
  # api — Backend .NET 8
  # ══════════════════════════════════════════════════════════════════════════════
  build-api:
    name: Build & Push — API (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sagrada-familia-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./SagradaFamilia
          file: ./SagradaFamilia/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_CONFIGURATION=Release
          # GitHub Actions Cache: reutiliza capas entre runs sin infraestructura extra.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api


  # ══════════════════════════════════════════════════════════════════════════════
  # predict — Microservicio Python + Prophet
  # Es el build más pesado (descarga CmdStan ~200 MB); el caché GHA lo amortiza.
  # ══════════════════════════════════════════════════════════════════════════════
  build-predict:
    name: Build & Push — Predict (Python + Prophet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sagrada-familia-predict
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sagrada-predict-api
          file: ./sagrada-predict-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_ENV=production
          cache-from: type=gha,scope=predict
          cache-to: type=gha,mode=max,scope=predict


  # ══════════════════════════════════════════════════════════════════════════════
  # web — Angular + nginx
  # ══════════════════════════════════════════════════════════════════════════════
  build-web:
    name: Build & Push — Web (Angular + nginx)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sagrada-familia-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sagrada-familia-web
          file: ./sagrada-familia-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_CONFIGURATION=production
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
